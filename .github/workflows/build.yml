name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ChargeTime.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: charge-widget
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChargeTime-APK
          path: charge-widget/app/build/outputs/apk/debug/app-debug.apk
